<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Types | Rust Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_design/styles.css">
  <style>
    :root {
      --color-bg:      #FFFFFF;
      --color-ink:     #171714;
      --color-muted:   #77766F;
      --color-border:  #171714;
      --color-primary: #FF7657;
      --card-shell:    #F2F5F7;
      --card-w:        260px;
      --card-h:        360px;
      --shell-pad:     14px;
      --footer-h:      62px;
      --radius-card:   8px;
      --label-color:   #FF7657;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-ink); min-height: 100vh; }

    /* ── Nav ── */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--color-border); }
    .site-header-left { display: flex; align-items: center; gap: 10px; }
    .site-name { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--color-ink); }
    .header-sep { color: var(--color-muted); font-size: 14px; }
    .header-title { font-size: 14px; font-weight: 500; color: var(--color-muted); }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 13px; font-weight: 600; color: var(--color-muted); text-decoration: none; letter-spacing: 0.02em; text-transform: uppercase; }
    .nav-link.active { color: var(--color-primary); }

    /* ── Page header ── */
    .page-header { padding: 40px 32px 48px; border-bottom: 1px solid var(--color-border); display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
    .page-header-left { display: flex; flex-direction: column; gap: 8px; }
    .page-title { font-size: clamp(32px, 4vw, 52px); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .page-hint { font-size: 13px; color: var(--color-muted); }
    .page-header-right { max-width: 340px; padding-bottom: 4px; }
    .page-description { font-size: 14px; font-weight: 400; line-height: 1.5; color: var(--color-muted); }

    /* ── Cards ── */
    .cards-section { padding: 40px 32px 80px; }
    .cards-grid { display: flex; flex-wrap: wrap; gap: 24px; }

    /* ── Flip card ── */
    .flashcard { width: var(--card-w); height: var(--card-h); perspective: 1000px; cursor: pointer; border: none; background: transparent; padding: 0; display: block; }
    .flashcard-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1); }
    .flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card-shell); border-radius: var(--radius-card); padding: var(--shell-pad); overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,0.14); }
    .flashcard-back { transform: rotateY(180deg); }

    /* ── RUST label ── */
    .card-label { position: absolute; top: 8px; left: 4px; z-index: 10; font-size: 9px; font-weight: 800; color: rgba(11,13,18,0.5); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── Front panel 232x280 ── */
    .card-panel {
      width: 232px; height: 280px;
      background: linear-gradient(135deg, #FF7657 0%, #FF9070 34%, #FFAB90 68%, #FFC8B0 100%);
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 236 Q 232 252 225 259 L 205 274 Q 204 280 196 280 L 14 280 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon { width: 108px; height: 108px; position: relative; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12)); }
    .card-icon svg { width: 100%; height: 100%; display: block; }

    /* ── Front footer ── */
    .card-footer { position: absolute; bottom: 0; left: 0; right: 0; height: var(--footer-h); padding: 0 14px; display: flex; align-items: center; background: var(--card-shell); }
    .card-title { font-size: 28px; font-weight: 900; line-height: 1; letter-spacing: -0.04em; text-transform: uppercase; color: #0B0D12; }
    .card-title.long { font-size: 18px; }
    .card-title.medium { font-size: 22px; }

    /* ── Back panel 232x332 ── */
    .back-panel {
      width: 232px; height: 332px;
      background: linear-gradient(135deg, #FFD4C8 0%, #FFE8E0 100%);
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 286 Q 232 302 225 309 L 205 326 Q 204 332 196 332 L 14 332 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      padding: 42px 18px 18px;
      display: flex; flex-direction: column;
    }
    .back-title { font-size: 26px; font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; color: #0B0D12; line-height: 0.95; text-align: right; margin-bottom: 16px; }
    .back-sections { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
    .back-section { padding-top: 14px; margin-top: 14px; border-top: 1px solid rgba(11,13,18,0.18); }
    .back-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .section-label { display: block; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--label-color); margin-bottom: 4px; }
    .section-body { font-size: 11.5px; font-weight: 400; line-height: 1.35; color: #0B0D12; }
    code { font-family: "SF Mono","Fira Code",monospace; font-size: 11px; color: #0B0D12; }

    /* ── Progress bar ── */
    .progress-bar-wrap { position: fixed; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.08); z-index: 100; }
    .progress-bar { height: 100%; background: var(--color-primary); transition: width 300ms ease; }
  </style>
  <link rel="stylesheet" href="../_design/mobile.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header-left">
      <a href="../index.html" class="site-name">Rust Buddy</a>
      <span class="header-sep">/</span>
      <a href="index.html" class="header-title" style="text-decoration:none;color:var(--color-muted);">Flashcards</a>
      <span class="header-sep">/</span>
      <span class="header-title">Types</span>
    </div>
  </header>

  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-title">Types</h1>
      <p class="page-hint">Click a card to flip it · 9 terms</p>
    </div>
    <div class="page-header-right">
      <p class="page-description">Every value in Rust has a specific type. This deck covers the primitive types: <code>char</code> for single characters, <code>bool</code> for true or false, and numeric types like <code>i32</code>, <code>u32</code>, <code>f64</code>, and <code>usize</code>.</p>
    </div>
  </div>

  <section class="cards-section">
    <div class="cards-grid">

      <!-- 1. Unit type -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <path d="M 30 18 Q 14 40 30 62" stroke="rgba(0,0,0,0.28)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M 50 18 Q 66 40 50 62" stroke="rgba(0,0,0,0.28)" stroke-width="6" stroke-linecap="round" fill="none"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title medium">UNIT TYPE</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">UNIT TYPE</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Rust's empty value, means "nothing"</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">When a function returns nothing meaningful</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>fn greet() { println!("hi"); }<br>// returns () by default</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 2. bool -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <circle cx="26" cy="40" r="14" fill="rgba(0,0,0,0.28)"/>
                <circle cx="56" cy="40" r="14" stroke="rgba(0,0,0,0.22)" stroke-width="4" fill="none"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">BOOL</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">BOOL</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body"><code>true</code> or <code>false</code>, nothing else</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Status flags: <code>is_paid</code>, <code>is_verified</code></p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let is_paid: bool = true;<br>let is_verified: bool = false;</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 3. char -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="22" y="22" width="36" height="36" rx="4" fill="rgba(0,0,0,0.22)"/>
                <circle cx="40" cy="40" r="7" fill="rgba(0,0,0,0.35)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">CHAR</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">CHAR</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">One character, single quotes</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body"><code>'A'</code>, <code>'🔥'</code>, single symbols, not strings</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let letter: char = 'A';<br>let emoji: char = '🔥';</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 4. println! -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="10" y="16" width="60" height="48" rx="5" fill="rgba(0,0,0,0.22)"/>
                <rect x="18" y="28" width="36" height="5" rx="2" fill="rgba(0,0,0,0.3)"/>
                <rect x="18" y="38" width="24" height="5" rx="2" fill="rgba(0,0,0,0.22)"/>
                <rect x="18" y="48" width="10" height="5" rx="2" fill="rgba(0,0,0,0.4)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">PRINTLN!</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">PRINTLN!</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Prints a line to the terminal</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Debugging or showing output</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let name = "Alice";<br>println!("Hello, {}!", name);</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 5. {:?} -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <circle cx="32" cy="32" r="17" stroke="rgba(0,0,0,0.25)" stroke-width="5" fill="none"/>
                <circle cx="32" cy="32" r="8" fill="rgba(0,0,0,0.15)"/>
                <line x1="44" y1="44" x2="62" y2="62" stroke="rgba(0,0,0,0.28)" stroke-width="6" stroke-linecap="round"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">{:?}</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">{:?}</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Debug print formatting</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Printing arrays and tuples that <code>{}</code> cannot print</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let arr = [1, 2, 3];<br>println!("{:?}", arr);</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 6. [u8; 32] -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="12" y="22" width="16" height="16" rx="2" fill="rgba(0,0,0,0.28)"/>
                <rect x="32" y="22" width="16" height="16" rx="2" fill="rgba(0,0,0,0.22)"/>
                <rect x="52" y="22" width="16" height="16" rx="2" fill="rgba(0,0,0,0.28)"/>
                <rect x="12" y="42" width="16" height="16" rx="2" fill="rgba(0,0,0,0.22)"/>
                <rect x="32" y="42" width="16" height="16" rx="2" fill="rgba(0,0,0,0.28)"/>
                <rect x="52" y="42" width="16" height="16" rx="2" fill="rgba(0,0,0,0.22)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">[U8; 32]</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">[U8; 32]</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">An array of exactly 32 unsigned bytes</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Wallet addresses on Solana</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let addr: [u8; 32] = [0; 32];<br>println!("{:?}", addr);</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 7. usize -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="10" y="38" width="60" height="8" rx="3" fill="rgba(0,0,0,0.2)"/>
                <rect x="16" y="28" width="4" height="12" rx="1" fill="rgba(0,0,0,0.28)"/>
                <rect x="30" y="30" width="4" height="10" rx="1" fill="rgba(0,0,0,0.22)"/>
                <rect x="44" y="28" width="4" height="12" rx="1" fill="rgba(0,0,0,0.28)"/>
                <rect x="58" y="30" width="4" height="10" rx="1" fill="rgba(0,0,0,0.22)"/>
                <circle cx="16" cy="52" r="5" fill="rgba(0,0,0,0.35)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">USIZE</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">USIZE</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">An unsigned integer whose size matches the computer's architecture, 8 bytes on 64-bit</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Used for memory sizes, slice lengths, and array indexes, the type Rust uses internally for positions</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let len: usize = 32;<br>let i: usize = 0;</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 8. Type casting -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="8" y="22" width="24" height="16" rx="3" fill="rgba(0,0,0,0.25)"/>
                <rect x="48" y="42" width="24" height="16" rx="3" fill="rgba(0,0,0,0.25)"/>
                <path d="M 32 30 Q 50 30 50 42" stroke="rgba(0,0,0,0.22)" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M 44 36 L 50 42 L 56 36" stroke="rgba(0,0,0,0.22)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title medium">TYPE CASTING</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">TYPE CASTING</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Converting a value from one type to another using the <code>as</code> keyword, always explicit, never automatic</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body"><code>let x: i32 = 1000; let y = x as u8;</code></p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let x: i32 = 1000;<br>let y = x as u8;</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 9. ASCII value -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="8" y="26" width="22" height="28" rx="4" fill="rgba(0,0,0,0.22)"/>
                <rect x="50" y="26" width="22" height="28" rx="4" fill="rgba(0,0,0,0.22)"/>
                <line x1="30" y1="40" x2="50" y2="40" stroke="rgba(0,0,0,0.28)" stroke-width="4"/>
                <path d="M 36 34 L 30 40 L 36 46" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 44 34 L 50 40 L 44 46" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title medium">ASCII VALUE</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">ASCII VALUE</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">The numeric code that represents a character</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body"><code>'a' as u8</code> gives <code>97</code>; <code>97u8 as char</code> gives <code>'a'</code></p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let n: u8 = 'a' as u8;<br>let c: char = 97u8 as char;</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

    </div>
  </section>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
  </div>

  <script>
    const cards = document.querySelectorAll('.flashcard');
    const bar = document.getElementById('progress-bar');
    const seen = new Set();
    cards.forEach((card, i) => {
      card.addEventListener('click', () => {
        seen.add(i);
        bar.style.width = (seen.size / cards.length * 100) + '%';
      });
    });
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
