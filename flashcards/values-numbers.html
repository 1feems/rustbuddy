<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Values &amp; Numbers — Rust Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg:        #FFFFFF;
      --color-ink:       #171714;
      --color-muted:     #77766F;
      --color-border:    #171714;
      --color-primary:   #FF7657;
      --color-surface:   #1E1E1A;

      --card-shell: #1E1E1A;
      --card-w: 260px;
      --card-h: 360px;
      --shell-pad: 14px;
      --footer-h: 62px;
      --radius-card: 20px;

      --grad-lime:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.25) 0%, rgba(255,255,255,0) 32%),
        linear-gradient(135deg, #A8D92F 0%, #C5E94E 34%, #DAF06F 68%, #EFF8A7 100%);
      --grad-lime-back:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,.50) 0%, rgba(255,255,255,0) 34%),
        linear-gradient(135deg, #F1FADC 0%, #FAFDF0 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
    }

    /* ── Nav ── */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--color-border);
    }
    .site-header-left { display: flex; align-items: center; gap: 10px; }
    .site-name { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--color-ink); }
    .back-link { font-size: 14px; color: var(--color-muted); text-decoration: none; transition: color 200ms ease; }
    .back-link:hover { color: var(--color-ink); }
    .header-sep { color: var(--color-muted); font-size: 14px; }
    .header-title { font-size: 14px; font-weight: 500; color: var(--color-muted); }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 13px; font-weight: 600; color: var(--color-muted); text-decoration: none; letter-spacing: 0.02em; text-transform: uppercase; }
    .nav-link:hover { color: var(--color-ink); }
    .nav-link.active { color: var(--color-primary); }

    /* ── Page header ── */
    .page-header {
      padding: 40px 32px 32px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .page-title { font-size: clamp(32px, 4vw, 52px); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .page-hint { font-size: 13px; color: var(--color-muted); padding-bottom: 4px; }

    /* ── Cards section ── */
    .cards-section { padding: 40px 32px 80px; }
    .cards-grid { display: flex; flex-wrap: wrap; gap: 24px; }

    /* ── Card shell wrapper ── */
    .card-shell-wrap {
      padding: 1px;
      border-radius: calc(var(--radius-card) + 1px);
      background: linear-gradient(to right bottom, rgba(23,23,20,0.8), rgba(23,23,20,0.2), rgba(0,0,0,0.05));
      display: inline-block;
    }

    /* ── Flip card ── */
    .flashcard {
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      display: block;
    }

    .flashcard-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-shell);
      border-radius: var(--radius-card);
      padding: var(--shell-pad);
      overflow: hidden;
    }

    .flashcard-back { transform: rotateY(180deg); }

    /* ── FRONT ── */
    .card-front {
      position: relative;
      display: grid;
      grid-template-rows: 1fr var(--footer-h);
      width: 100%;
      height: 100%;
    }

    .card-label {
      position: absolute;
      top: 6px; left: 0;
      z-index: 10;
      font-size: 9px; font-weight: 800; line-height: 1;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    .card-panel {
      position: relative;
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 226 Q 232 242 225 249 L 205 264 Q 204 270 196 270 L 14 270 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--grad-lime);
    }

    .card-panel::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,.10), transparent 34%), linear-gradient(315deg, rgba(0,0,0,.10), transparent 48%);
      pointer-events: none;
    }

    .card-icon {
      width: 108px; height: 108px;
      position: relative; z-index: 1;
      color: rgba(23,23,20,.80);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.12));
    }

    .card-icon svg { width: 100%; height: 100%; display: block; }

    .card-footer { background: var(--card-shell); display: flex; align-items: center; padding: 0 10px; }

    .card-title {
      font-size: 28px; font-weight: 900; line-height: .9;
      letter-spacing: -0.04em; text-transform: uppercase;
      color: #FFFFFF; overflow-wrap: anywhere;
    }
    .card-title.long { font-size: 20px; line-height: .95; }
    .card-title.medium { font-size: 23px; }

    /* ── BACK ── */
    .card-back { position: relative; width: 100%; height: 100%; }

    .back-panel {
      position: relative;
      height: 100%;
      padding: 42px 18px 18px;
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 286 Q 232 302 225 309 L 205 326 Q 204 332 196 332 L 14 332 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      background: var(--grad-lime-back);
    }

    .back-title {
      margin: 0 0 14px;
      font-size: 26px; font-weight: 900;
      letter-spacing: -0.04em; text-transform: uppercase;
      color: var(--color-ink); overflow-wrap: anywhere;
    }
    .back-title.long { font-size: 19px; margin-bottom: 10px; }
    .back-title.medium { font-size: 22px; }

    .back-section { margin-top: 11px; padding-top: 11px; border-top: 1px solid rgba(23,23,20,.14); }
    .back-section:first-of-type { border-top: 0; padding-top: 0; }

    .back-section h3 {
      margin: 0 0 4px;
      font-size: 10px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--color-ink);
    }

    .back-section p, .back-section code {
      margin: 0;
      font-family: inherit;
      font-size: 11.5px; line-height: 1.4;
      color: var(--color-ink);
    }

    .back-section code { font-family: "SF Mono", "Fira Code", monospace; font-size: 11px; }
  </style>
</head>
