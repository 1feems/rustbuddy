<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symbols | Rust Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_design/styles.css">
  <style>
    :root {
      --color-bg:      #FFFFFF;
      --color-ink:     #171714;
      --color-muted:   #77766F;
      --color-border:  #171714;
      --color-primary: #FF7657;
      --card-shell:    #F2F5F7;
      --card-w:        260px;
      --card-h:        360px;
      --shell-pad:     14px;
      --footer-h:      62px;
      --radius-card:   8px;
      --label-color:   #7B5EA7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-ink); min-height: 100vh; }

    /* ── Nav ── */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--color-border); }
    .site-header-left { display: flex; align-items: center; gap: 10px; }
    .site-name { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--color-ink); }
    .header-sep { color: var(--color-muted); font-size: 14px; }
    .header-title { font-size: 14px; font-weight: 500; color: var(--color-muted); }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 13px; font-weight: 600; color: var(--color-muted); text-decoration: none; letter-spacing: 0.02em; text-transform: uppercase; }
    .nav-link.active { color: var(--color-primary); }

    /* ── Page header ── */
    .page-header { padding: 40px 32px 48px; border-bottom: 1px solid var(--color-border); display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
    .page-header-left { display: flex; flex-direction: column; gap: 8px; }
    .page-title { font-size: clamp(32px, 4vw, 52px); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .page-hint { font-size: 13px; color: var(--color-muted); }
    .page-header-right { max-width: 340px; padding-bottom: 4px; }
    .page-description { font-size: 14px; font-weight: 400; line-height: 1.5; color: var(--color-muted); }

    /* ── Cards ── */
    .cards-section { padding: 40px 32px 80px; }
    .cards-grid { display: flex; flex-wrap: wrap; gap: 24px; }

    /* ── Flip card ── */
    .flashcard { width: var(--card-w); height: var(--card-h); perspective: 1000px; cursor: pointer; border: none; background: transparent; padding: 0; display: block; }
    .flashcard-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1); }
    .flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card-shell); border-radius: var(--radius-card); padding: var(--shell-pad); overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,0.14); }
    .flashcard-back { transform: rotateY(180deg); }

    /* ── RUST label ── */
    .card-label { position: absolute; top: 8px; left: 4px; z-index: 10; font-size: 9px; font-weight: 800; color: rgba(11,13,18,0.5); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── Front panel 232x280 ── */
    .card-panel {
      width: 232px; height: 280px;
      background: linear-gradient(135deg, #7B5EA7 0%, #9B7EC8 34%, #BDA8E0 68%, #D8C8F0 100%);
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 236 Q 232 252 225 259 L 205 274 Q 204 280 196 280 L 14 280 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon { width: 108px; height: 108px; position: relative; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12)); }
    .card-icon svg { width: 100%; height: 100%; display: block; }

    /* ── Front footer ── */
    .card-footer { position: absolute; bottom: 0; left: 0; right: 0; height: var(--footer-h); padding: 0 14px; display: flex; align-items: center; background: var(--card-shell); }
    .card-title { font-family: "SF Mono","Fira Code",monospace; font-size: 28px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; color: #0B0D12; }
    .card-title.medium { font-size: 22px; }

    /* ── Back panel 232x332 ── */
    .back-panel {
      width: 232px; height: 332px;
      background: linear-gradient(135deg, #D8CAF0 0%, #EDE6F8 100%);
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 286 Q 232 302 225 309 L 205 326 Q 204 332 196 332 L 14 332 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      padding: 42px 18px 18px;
      display: flex; flex-direction: column;
    }
    .back-title { font-family: "SF Mono","Fira Code",monospace; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #0B0D12; line-height: 0.95; text-align: right; margin-bottom: 16px; }
    .back-sections { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
    .back-section { padding-top: 14px; margin-top: 14px; border-top: 1px solid rgba(11,13,18,0.18); }
    .back-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .section-label { display: block; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--label-color); margin-bottom: 4px; }
    .section-body { font-size: 11.5px; font-weight: 400; line-height: 1.35; color: #0B0D12; }
    code { font-family: "SF Mono","Fira Code",monospace; font-size: 11px; color: #0B0D12; }

    /* ── Progress bar ── */
    .progress-bar-wrap { position: fixed; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.08); z-index: 100; }
    .progress-bar { height: 100%; background: var(--color-primary); transition: width 300ms ease; }

    /* ── Breadcrumb ── */
    .breadcrumb {
      padding: 10px 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      border-bottom: 1px solid rgba(23,23,20,0.08);
    }
    .breadcrumb a {
      color: var(--color-muted);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: var(--color-ink); }
    .bc-sep { color: rgba(23,23,20,0.25); }
    .bc-current { color: var(--color-ink); font-weight: 500; }
  </style>
  <link rel="stylesheet" href="../_design/mobile.css">
</head>
<body>

    <header class="site-header">
    <div class="site-header-left">
      <a href="../index.html" class="site-name">Rust Buddy</a>
    </div>
    <nav class="nav-links">
      <a href="../exercises/index.html" class="nav-link">Exercises</a>
      <a href="../flashcards/index.html" class="nav-link active">Flashcards</a>
      <a href="../resources/index.html" class="nav-link">Resources</a>
    </nav>
  </header>
  <nav class="breadcrumb">
    <a href="../index.html">Rust Buddy</a>
    <span class="bc-sep">/</span>
    <a href="index.html">Flashcards</a>
    <span class="bc-sep">/</span>
    <span class="bc-current">Symbols</span>
  </nav>

  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-title">Symbols</h1>
      <p class="page-hint">Click a card to flip it · 8 terms</p>
    </div>
    <div class="page-header-right">
      <p class="page-description">The special characters you'll see in almost every Rust file. Knowing what each one means by sight will make reading code much faster.</p>
    </div>
  </div>

  <section class="cards-section">
    <div class="cards-grid">

      <!-- 1. ? -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <path d="M 26 30 Q 26 14 40 14 Q 56 14 56 28 Q 56 42 40 46 L 40 52" stroke="rgba(255,255,255,0.9)" stroke-width="7" stroke-linecap="round" fill="none"/>
                <circle cx="40" cy="64" r="6" fill="rgba(255,255,255,0.9)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">?</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">?</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Propagates an error to the caller if the result is <code>Err</code></p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">When calling a function that returns <code>Result</code> or <code>Option</code></p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let data = read_file(path)?;<br>// returns Err up if it fails</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 2. :: -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <circle cx="28" cy="28" r="8" fill="rgba(255,255,255,0.9)"/>
                <circle cx="28" cy="52" r="8" fill="rgba(255,255,255,0.9)"/>
                <circle cx="52" cy="28" r="8" fill="rgba(255,255,255,0.65)"/>
                <circle cx="52" cy="52" r="8" fill="rgba(255,255,255,0.65)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">::</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">::</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Navigates into a type, module, or enum to access items inside</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Calling associated functions or accessing enum variants</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let s = String::from("hi");<br>let v = Vec::new();</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 3. => -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="8" y="32" width="28" height="6" rx="2" fill="rgba(255,255,255,0.9)"/>
                <rect x="8" y="42" width="28" height="6" rx="2" fill="rgba(255,255,255,0.9)"/>
                <line x1="38" y1="40" x2="66" y2="40" stroke="rgba(255,255,255,0.9)" stroke-width="6" stroke-linecap="round"/>
                <path d="M 56 30 L 66 40 L 56 50" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">=></p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">=></h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Separates a match pattern from the code that runs for that case</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Inside a <code>match</code> block, one per case</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>match coin { Heads => 1,<br>Tails => 0 }</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 4. | -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <rect x="20" y="18" width="8" height="44" rx="3" fill="rgba(255,255,255,0.9)"/>
                <rect x="52" y="18" width="8" height="44" rx="3" fill="rgba(255,255,255,0.9)"/>
                <circle cx="40" cy="40" r="9" fill="rgba(255,255,255,0.5)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">|</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">|</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Wraps a closure's parameters; defines an inline anonymous function</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Passing logic to iterators like <code>map</code> or <code>filter</code></p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let double = |x| x * 2;<br>double(5) // returns 10</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 5. .. -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <circle cx="26" cy="40" r="11" fill="rgba(255,255,255,0.9)"/>
                <circle cx="54" cy="40" r="11" fill="rgba(255,255,255,0.65)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">..</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">..</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">An exclusive range: start up to but not including end</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Looping over a count or slicing a collection</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>for i in 0..5 {<br>// i = 0, 1, 2, 3, 4</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 6. ..= -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <circle cx="18" cy="40" r="9" fill="rgba(255,255,255,0.9)"/>
                <circle cx="36" cy="40" r="9" fill="rgba(255,255,255,0.7)"/>
                <rect x="50" y="33" width="22" height="5" rx="2" fill="rgba(255,255,255,0.9)"/>
                <rect x="50" y="42" width="22" height="5" rx="2" fill="rgba(255,255,255,0.9)"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">..=</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">..=</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">An inclusive range: start through and including end</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">When you need to include the last value in a range</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>for i in 0..=5 {<br>// i = 0, 1, 2, 3, 4, 5</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 7. #[...] -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <line x1="22" y1="16" x2="22" y2="60" stroke="rgba(255,255,255,0.9)" stroke-width="5" stroke-linecap="round"/>
                <line x1="36" y1="16" x2="36" y2="60" stroke="rgba(255,255,255,0.75)" stroke-width="5" stroke-linecap="round"/>
                <line x1="12" y1="28" x2="46" y2="28" stroke="rgba(255,255,255,0.9)" stroke-width="5" stroke-linecap="round"/>
                <line x1="12" y1="48" x2="46" y2="48" stroke="rgba(255,255,255,0.75)" stroke-width="5" stroke-linecap="round"/>
                <path d="M 58 24 L 52 24 L 52 56 L 58 56" stroke="rgba(255,255,255,0.9)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title medium">#[...]</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">#[...]</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">An attribute that tells the compiler how to handle the next item</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Deriving traits or marking types for special behavior</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>#[derive(Debug, Clone)]<br>struct Point { x: i32 }</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- 8. pub -->
      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none">
                <circle cx="40" cy="40" r="10" fill="rgba(255,255,255,0.9)"/>
                <circle cx="40" cy="40" r="22" stroke="rgba(255,255,255,0.55)" stroke-width="5" fill="none"/>
                <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,0.25)" stroke-width="5" fill="none"/>
              </svg></div>
            </div>
            <div class="card-footer"><p class="card-title">pub</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">pub</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Makes an item visible and usable outside its current module</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">When a function, struct, or field needs to be public</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>pub fn transfer() { }<br>pub struct Account { }</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

    </div>
  </section>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
  </div>

  <script>
    const cards = document.querySelectorAll('.flashcard');
    const bar = document.getElementById('progress-bar');
    const seen = new Set();
    cards.forEach((card, i) => {
      card.addEventListener('click', () => {
        seen.add(i);
        bar.style.width = (seen.size / cards.length * 100) + '%';
      });
    });
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
