<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option | Rust Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_design/styles.css">
  <style>
    :root {
      --color-bg:      #FFFFFF;
      --color-ink:     #171714;
      --color-muted:   #77766F;
      --color-border:  #171714;
      --color-primary: #FF7657;
      --card-shell:    #F2F5F7;
      --card-w:        260px;
      --card-h:        360px;
      --shell-pad:     14px;
      --footer-h:      62px;
      --radius-card:   8px;
      --label-color:   #A8D92F;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-ink); min-height: 100vh; }

    /* ── Nav ── */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--color-border); }
    .site-header-left { display: flex; align-items: center; gap: 10px; }
    .site-name { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--color-ink); }
    .header-sep { color: var(--color-muted); font-size: 14px; }
    .header-title { font-size: 14px; font-weight: 500; color: var(--color-muted); }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 13px; font-weight: 600; color: var(--color-muted); text-decoration: none; letter-spacing: 0.02em; text-transform: uppercase; }
    .nav-link.active { color: var(--color-primary); }

    /* ── Page header ── */
    .page-header { padding: 40px 32px 48px; border-bottom: 1px solid var(--color-border); display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
    .page-header-left { display: flex; flex-direction: column; gap: 8px; }
    .page-title { font-size: clamp(32px, 4vw, 52px); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .page-hint { font-size: 13px; color: var(--color-muted); }
    .page-header-right { max-width: 340px; padding-bottom: 4px; }
    .page-description { font-size: 14px; font-weight: 400; line-height: 1.5; color: var(--color-muted); }

    /* ── Cards ── */
    .cards-section { padding: 40px 32px 80px; }
    .cards-grid { display: flex; flex-wrap: wrap; gap: 24px; }

    /* ── Flip card ── */
    .flashcard { width: var(--card-w); height: var(--card-h); perspective: 1000px; cursor: pointer; border: none; background: transparent; padding: 0; display: block; }
    .flashcard-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1); }
    .flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card-shell); border-radius: var(--radius-card); padding: var(--shell-pad); overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,0.14); }
    .flashcard-back { transform: rotateY(180deg); }

    /* ── RUST label ── */
    .card-label { position: absolute; top: 8px; left: 4px; z-index: 10; font-size: 9px; font-weight: 800; color: rgba(11,13,18,0.5); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── Front panel 232×280 ── */
    .card-panel {
      width: 232px; height: 280px;
      background: linear-gradient(135deg, #A8D92F 0%, #C5E94E 34%, #DAF06F 68%, #EFF8A7 100%);
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 236 Q 232 252 225 259 L 205 274 Q 204 280 196 280 L 14 280 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon { width: 108px; height: 108px; position: relative; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12)); }
    .card-icon svg { width: 100%; height: 100%; display: block; }

    /* ── Front footer ── */
    .card-footer { position: absolute; bottom: 0; left: 0; right: 0; height: var(--footer-h); padding: 0 14px; display: flex; align-items: center; background: var(--card-shell); }
    .card-title { font-size: 28px; font-weight: 900; line-height: 1; letter-spacing: -0.04em; text-transform: uppercase; color: #0B0D12; }
    .card-title.long { font-size: 18px; }
    .card-title.medium { font-size: 22px; }

    /* ── Back panel 232×332 ── */
    .back-panel {
      width: 232px; height: 332px;
      background: linear-gradient(135deg, #DCF5A8 0%, #EDFCCB 100%);
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 286 Q 232 302 225 309 L 205 326 Q 204 332 196 332 L 14 332 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      padding: 42px 18px 18px;
      display: flex; flex-direction: column;
    }
    .back-title { font-size: 26px; font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; color: #0B0D12; line-height: 0.95; text-align: right; margin-bottom: 16px; }
    .back-title.long { font-size: 16px; }
    .back-title.medium { font-size: 20px; }
    .back-sections { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
    .back-section { padding-top: 14px; margin-top: 14px; border-top: 1px solid rgba(11,13,18,0.18); }
    .back-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .section-label { display: block; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--label-color); margin-bottom: 4px; }
    .section-body { font-size: 11.5px; font-weight: 400; line-height: 1.35; color: #0B0D12; }
    code { font-family: "SF Mono","Fira Code",monospace; font-size: 11px; color: #0B0D12; }

    /* ── Progress bar ── */
    .progress-bar-wrap { position: fixed; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.08); z-index: 100; }
    .progress-bar { height: 100%; background: var(--color-primary); transition: width 300ms ease; }
  </style>
  <link rel="stylesheet" href="../_design/mobile.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header-left">
      <a href="../index.html" class="site-name">Rust Buddy</a>
      <span class="header-sep">/</span>
      <a href="index.html" class="header-title" style="text-decoration:none;color:var(--color-muted);">Flashcards</a>
      <span class="header-sep">/</span>
      <span class="header-title">Option</span>
    </div>
    <nav class="nav-links">
      <a href="../exercises/index.html" class="nav-link">Exercises</a>
      <a href="index.html" class="nav-link active">Flashcards</a>
      <a href="../resources/index.html" class="nav-link">Resources</a>
    </nav>
  </header>

  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-title">Option</h1>
      <p class="page-hint">Click a card to flip it · 6 terms</p>
    </div>
    <div class="page-header-right">
      <p class="page-description">Option is how Rust handles values that might not exist. Instead of null, you use Some(value) when a value exists and None when it doesn&#39;t.</p>
    </div>
  </div>

  <section class="cards-section">
    <div class="cards-grid">

      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none"><circle cx="30" cy="40" r="16" stroke="rgba(0,0,0,0.35)" stroke-width="3.5" fill="none"/><circle cx="30" cy="40" r="7" fill="rgba(0,0,0,0.3)"/><circle cx="60" cy="40" r="16" stroke="rgba(0,0,0,0.18)" stroke-width="3" stroke-dasharray="4 3" fill="none"/></svg></div>
            </div>
            <div class="card-footer"><p class="card-title medium">OPTION<T></p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title medium">OPTION<T></h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Either Some(value) or None. Rust's way of saying a value might not exist.</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Any value that could be absent. Replaces null from other languages.</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>fn find_user(id: u64)<br>  -> Option&lt;String&gt;</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="22" stroke="rgba(0,0,0,0.3)" stroke-width="3.5" fill="none"/><circle cx="40" cy="40" r="10" fill="rgba(0,0,0,0.28)"/></svg></div>
            </div>
            <div class="card-footer"><p class="card-title long">SOME(VALUE)</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title long">SOME(VALUE)</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">The Option variant that contains a value. Signals the value exists.</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Returning or matching when a result is present.</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>Some(42)<br>Some("Alice")<br>Some(wallet)</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="22" stroke="rgba(0,0,0,0.22)" stroke-width="3" stroke-dasharray="5 3" fill="none"/></svg></div>
            </div>
            <div class="card-footer"><p class="card-title">NONE</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title">NONE</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">The Option variant that means no value. Rust's replacement for null.</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Returning or matching when there is nothing to give back.</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>None // no value<br>// must be handled explicitly</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="22" stroke="rgba(0,0,0,0.3)" stroke-width="3" fill="none"/><path d="M32 40 L38 46 L50 34" stroke="rgba(0,0,0,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="card-footer"><p class="card-title medium">UNWRAP()</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title medium">UNWRAP()</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Pulls the value out of Some. Panics if the Option is None.</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">Only when you are certain the value exists. Avoid in production code.</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>let val = option.unwrap();<br>// panics if None!</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none"><circle cx="28" cy="40" r="14" stroke="rgba(0,0,0,0.3)" stroke-width="3" fill="none"/><circle cx="28" cy="40" r="6" fill="rgba(0,0,0,0.25)"/><circle cx="58" cy="40" r="14" stroke="rgba(0,0,0,0.18)" stroke-width="3" stroke-dasharray="4 3" fill="none"/><path d="M36 30 L44 30" stroke="rgba(0,0,0,0.25)" stroke-width="2.5" stroke-linecap="round"/><path d="M36 50 L44 50" stroke="rgba(0,0,0,0.18)" stroke-width="2.5" stroke-linecap="round"/></svg></div>
            </div>
            <div class="card-footer"><p class="card-title long">IS_SOME() / IS_NONE()</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title long">IS_SOME() / IS_NONE()</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">Checks whether an Option has a value or not. Returns bool.</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">The clean way to check before acting, without destructuring.</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>if option.is_some() {<br>  // handle it<br>}<br>if option.is_none() { ... }</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <button class="flashcard" onclick="this.classList.toggle('is-flipped')">
        <div class="flashcard-inner">
          <div class="flashcard-face">
            <span class="card-label">Rust</span>
            <div class="card-panel">
              <div class="card-icon"><svg viewBox="0 0 80 80" fill="none"><circle cx="30" cy="30" r="12" stroke="rgba(0,0,0,0.3)" stroke-width="3" fill="none"/><circle cx="30" cy="30" r="5" fill="rgba(0,0,0,0.28)"/><path d="M40 30 L50 30" stroke="rgba(0,0,0,0.25)" stroke-width="2.5" stroke-linecap="round"/><rect x="50" y="20" width="22" height="20" rx="3" fill="rgba(0,0,0,0.18)"/><path d="M30" y1="42" /><line x1="30" y1="42" x2="30" y2="54" stroke="rgba(0,0,0,0.18)" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round"/><rect x="14" y="54" width="52" height="14" rx="3" fill="rgba(0,0,0,0.1)"/></svg></div>
            </div>
            <div class="card-footer"><p class="card-title long">IF LET SOME</p></div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="card-label">Rust</span>
            <div class="back-panel">
              <h2 class="back-title long">IF LET SOME</h2>
              <div class="back-sections">
                <div class="back-section"><span class="section-label">Meaning</span><p class="section-body">A one-pattern shortcut for match. Handles Some and ignores None.</p></div>
                <div class="back-section"><span class="section-label">When to use it</span><p class="section-body">When you only care about the value existing, and want to skip the None case.</p></div>
                <div class="back-section"><span class="section-label">Example</span><p class="section-body"><code>if let Some(val) = result {<br>  println!("{}", val);<br>}</code></p></div>
              </div>
            </div>
          </div>
        </div>
      </button>

    </div>
  </section>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
  </div>

  <script>
    const cards = document.querySelectorAll('.flashcard');
    const bar = document.getElementById('progress-bar');
    const seen = new Set();
    cards.forEach((card, i) => {
      card.addEventListener('click', () => {
        seen.add(i);
        bar.style.width = (seen.size / cards.length * 100) + '%';
      });
    });
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
