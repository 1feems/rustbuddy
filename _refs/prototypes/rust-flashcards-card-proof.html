<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rust Flashcards — Card Proof</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-shell: #ffffff;
      --ink: #0b0d12;
      --muted: #8b95a5;

      --card-w: 260px;
      --card-h: 360px;
      --shell-pad: 14px;
      --footer-h: 62px;
      --radius-card: 8px;

      /*
        Panel dimensions:
          panel-w       = 260 - 28 = 232px
          panel-h-front = 360 - 28 - 62 = 270px
          panel-h-back  = 360 - 28 = 332px

        Shape — path() with stepped notch + diagonal cut:

        TOP-LEFT NOTCH (stepped, like design.md polygon but softened):
          Left edge rises to y=35.
          Short horizontal ledge: (0,35) → (12,35).
          ~45° diagonal: (12,35) → (32,6).
          Back to top edge: → (41,0).
          Small Q curves (r≈6) at each joint — crisp, not mushy.
          "RUST" label sits in the white tab above this notch.

        BOTTOM-RIGHT DIAGONAL CUT (large, clearly visible):
          Right edge at y≈226. Q into diagonal. Short diagonal. Q out to bottom.
          Spans ~36px wide × ~44px tall (~16% each edge).
      */

      --grad-demeter:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 32%),
        linear-gradient(145deg, #EBB014 0%, #F2D57F 100%);
      --grad-demeter-back:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,.50) 0%, rgba(255,255,255,0) 34%),
        linear-gradient(145deg, #fdf0ca 0%, #fffae8 100%);

      --grad-persephone:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 32%),
        linear-gradient(145deg, #E14666 0%, #F19385 100%);
      --grad-persephone-back:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,.50) 0%, rgba(255,255,255,0) 34%),
        linear-gradient(145deg, #fad6de 0%, #fdecea 100%);

      --grad-zeus:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 32%),
        linear-gradient(145deg, #7062E1 0%, #8999C1 100%);
      --grad-zeus-back:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,.50) 0%, rgba(255,255,255,0) 34%),
        linear-gradient(145deg, #e2defb 0%, #edf1f8 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #082347;
      font-family: "Space Grotesk", Inter, system-ui, sans-serif;
      color: var(--ink);
    }

    .proof-wrap { padding: 60px 48px; }

    .proof-hint {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 0 0 28px;
    }

    .proof { display: flex; gap: 40px; align-items: flex-start; }

    .flashcard {
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
    }

    .flashcard-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--card-shell);
      border-radius: var(--radius-card);
      padding: var(--shell-pad);
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
      overflow: hidden;
    }

    .flashcard-back { transform: rotateY(180deg); }

    /* ── FRONT ── */
    .card-front {
      position: relative;
      display: grid;
      grid-template-rows: 1fr var(--footer-h);
      width: 100%;
      height: 100%;
    }

    /*
      "RUST" is a sibling of .card-panel — never touches the gradient.
      Positioned in the white tab pocket above the notch floor (y=35).
      At x=7, notch floor is y=35; label is at y=6 → clearly on white shell.
    */
    .card-label {
      position: absolute;
      top: 6px;
      left: 0;
      z-index: 10;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      color: var(--ink);
      text-transform: uppercase;
    }

    /*
      Front panel clip — 232 × 270
      Stepped notch top-left, diagonal cut bottom-right, arcs r=14 on remaining corners.
    */
    .card-panel {
      position: relative;
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 226 Q 232 242 225 249 L 205 264 Q 204 270 196 270 L 14 270 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(145deg, rgba(255,255,255,.10), transparent 34%),
        linear-gradient(315deg, rgba(0,0,0,.10), transparent 48%);
      pointer-events: none;
    }

    .deck-demeter    .card-panel { background: var(--grad-demeter); }
    .deck-persephone .card-panel { background: var(--grad-persephone); }
    .deck-zeus       .card-panel { background: var(--grad-zeus); }
    .deck-demeter    .back-panel { background: var(--grad-demeter-back); }
    .deck-persephone .back-panel { background: var(--grad-persephone-back); }
    .deck-zeus       .back-panel { background: var(--grad-zeus-back); }

    .card-icon {
      width: 108px; height: 108px;
      position: relative; z-index: 1;
      color: rgba(255,255,255,.92);
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.22));
    }

    .card-icon svg { width: 100%; height: 100%; display: block; }

    .card-footer {
      background: var(--card-shell);
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .card-title {
      font-size: 28px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }

    /* ── BACK ── */
    .card-back {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /*
      Back panel clip — 232 × 332
      Same notch, cut scaled for 332px height.
    */
    .back-panel {
      position: relative;
      height: 100%;
      /* Top padding clears the notch zone (floor at y=35) */
      padding: 42px 18px 18px;
      clip-path: path('M 41 0 L 218 0 a 14 14 0 0 1 14 14 L 232 286 Q 232 302 225 309 L 205 326 Q 204 332 196 332 L 14 332 a 14 14 0 0 1 -14 -14 L 0 35 L 12 35 Q 18 35 21 29 L 32 6 Q 36 0 41 0 Z');
    }

    .back-title {
      margin: 0 0 14px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .back-section {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid rgba(11,13,18,.14);
    }

    .back-section:first-of-type { border-top: 0; padding-top: 0; }

    .back-section h3 {
      margin: 0 0 4px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--ink);
    }

    .back-section p,
    .back-section code {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--ink);
    }

    .deck-tag {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="proof-wrap">
    <p class="proof-hint">Click to flip</p>
    <div class="proof">

      <!-- CARD 1: bool — Data Types — Demeter gold -->
      <div>
        <button class="flashcard deck-demeter" onclick="this.classList.toggle('is-flipped')" aria-label="bool">
          <div class="flashcard-inner">
            <div class="flashcard-face">
              <div class="card-front">
                <span class="card-label">Rust</span>
                <div class="card-panel">
                  <div class="card-icon" aria-hidden="true">
                    <svg viewBox="0 0 120 120" fill="none">
                      <rect x="10" y="38" width="100" height="44" rx="22" fill="currentColor" opacity=".85"/>
                      <circle cx="82" cy="60" r="19" fill="white" opacity=".95"/>
                      <circle cx="82" cy="60" r="11" fill="currentColor" opacity=".45"/>
                    </svg>
                  </div>
                </div>
                <footer class="card-footer">
                  <h1 class="card-title">bool</h1>
                </footer>
              </div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="card-back">
                <span class="card-label">Rust</span>
                <div class="back-panel">
                  <h2 class="back-title">bool</h2>
                  <section class="back-section">
                    <h3>Meaning</h3>
                    <p>A value that is either true or false. Nothing else.</p>
                  </section>
                  <section class="back-section">
                    <h3>When to use it</h3>
                    <p>Use it when something can only be on or off — like whether a payment is valid or a user is logged in.</p>
                  </section>
                  <section class="back-section">
                    <h3>Example</h3>
                    <code>let is_active: bool = true;</code>
                  </section>
                </div>
              </div>
            </div>
          </div>
        </button>
        <p class="deck-tag">Data Types</p>
      </div>

      <!-- CARD 2: fn — Functions + Modules — Persephone pink -->
      <div>
        <button class="flashcard deck-persephone" onclick="this.classList.toggle('is-flipped')" aria-label="fn">
          <div class="flashcard-inner">
            <div class="flashcard-face">
              <div class="card-front">
                <span class="card-label">Rust</span>
                <div class="card-panel">
                  <div class="card-icon" aria-hidden="true">
                    <svg viewBox="0 0 120 120" fill="none">
                      <rect x="14" y="50" width="56" height="20" rx="4" fill="currentColor" opacity=".85"/>
                      <polygon points="70,36 106,60 70,84" fill="currentColor" opacity=".9"/>
                    </svg>
                  </div>
                </div>
                <footer class="card-footer">
                  <h1 class="card-title">fn</h1>
                </footer>
              </div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="card-back">
                <span class="card-label">Rust</span>
                <div class="back-panel">
                  <h2 class="back-title">fn</h2>
                  <section class="back-section">
                    <h3>Meaning</h3>
                    <p>A keyword that defines a function — a named block of code you can call by name.</p>
                  </section>
                  <section class="back-section">
                    <h3>When to use it</h3>
                    <p>Use it any time you want to give a set of instructions a name so you can reuse them.</p>
                  </section>
                  <section class="back-section">
                    <h3>Example</h3>
                    <code>fn greet() {<br>&nbsp;&nbsp;println!("hello");<br>}</code>
                  </section>
                </div>
              </div>
            </div>
          </div>
        </button>
        <p class="deck-tag">Functions + Modules</p>
      </div>

      <!-- CARD 3: Ownership — Module System + Ownership — Zeus purple -->
      <div>
        <button class="flashcard deck-zeus" onclick="this.classList.toggle('is-flipped')" aria-label="Ownership">
          <div class="flashcard-inner">
            <div class="flashcard-face">
              <div class="card-front">
                <span class="card-label">Rust</span>
                <div class="card-panel">
                  <div class="card-icon" aria-hidden="true">
                    <svg viewBox="0 0 120 120" fill="none">
                      <circle cx="44" cy="52" r="22" stroke="currentColor" stroke-width="9" fill="none" opacity=".9"/>
                      <rect x="60" y="48" width="46" height="9" rx="4" fill="currentColor" opacity=".9"/>
                      <rect x="88" y="57" width="9" height="14" rx="3" fill="currentColor" opacity=".9"/>
                      <rect x="74" y="57" width="9" height="10" rx="3" fill="currentColor" opacity=".9"/>
                    </svg>
                  </div>
                </div>
                <footer class="card-footer">
                  <h1 class="card-title">Ownership</h1>
                </footer>
              </div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="card-back">
                <span class="card-label">Rust</span>
                <div class="back-panel">
                  <h2 class="back-title">Ownership</h2>
                  <section class="back-section">
                    <h3>Meaning</h3>
                    <p>Rust's rule that every value has exactly one owner. When the owner is done, the value is gone.</p>
                  </section>
                  <section class="back-section">
                    <h3>When to use it</h3>
                    <p>You are always using it. Every variable you create has an owner — Rust tracks this automatically.</p>
                  </section>
                  <section class="back-section">
                    <h3>Example</h3>
                    <code>let name = String::from("Alice");<br>// name owns this string</code>
                  </section>
                </div>
              </div>
            </div>
          </div>
        </button>
        <p class="deck-tag">Module System + Ownership</p>
      </div>

    </div>
  </div>

  <script>
    document.querySelectorAll('.flashcard').forEach(card => {
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          card.classList.toggle('is-flipped');
        }
      });
    });
  </script>
</body>
</html>
