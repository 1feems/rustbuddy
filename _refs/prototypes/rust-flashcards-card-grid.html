<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rust Flashcards Card Mockup</title>
  <style>
    :root {
      --page-bg: #f1efea;
      --card-shell: #ffffff;
      --ink: #0b0d12;
      --muted: #4b5563;

      --card-w: 260px;
      --card-h: 360px;
      --shell-pad: 10px;
      --footer-h: 62px;

      --radius-card: 6px;
      --radius-panel: 10px;

      --grad-purple: linear-gradient(
        135deg,
        #7b72e6 0%,
        #8d82e8 28%,
        #9d91ea 58%,
        #b7a8f0 100%
      );
      --grad-gold: linear-gradient(
        135deg,
        #dda111 0%,
        #edbd2f 28%,
        #f3cf5a 58%,
        #f8df91 100%
      );
      --grad-blue: linear-gradient(
        135deg,
        #5689e8 0%,
        #75a2ed 28%,
        #91b8f2 58%,
        #b7d2fb 100%
      );
      --grad-cyan: linear-gradient(
        135deg,
        #16a8c8 0%,
        #36bdd8 28%,
        #70d8e6 58%,
        #aaedf0 100%
      );
      --grad-lime: linear-gradient(
        135deg,
        #a8d934 0%,
        #c4e94e 28%,
        #d8f070 58%,
        #eef8a7 100%
      );
      --grad-pink: linear-gradient(
        135deg,
        #df4b78 0%,
        #ea678a 28%,
        #f0878d 58%,
        #f6aa78 100%
      );
      --grad-violet: linear-gradient(
        135deg,
        #8739aa 0%,
        #a64fc0 28%,
        #bf6bd1 58%,
        #da91e4 100%
      );
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      font-family: "Space Grotesk", "Satoshi", "Neue Montreal", Inter, system-ui, sans-serif;
      color: var(--ink);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(100%, 1360px);
      margin: 0 auto;
      padding: 48px 40px 56px;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 38px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 900;
      line-height: .95;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .masthead p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 920px) 300px;
      gap: 56px;
      align-items: start;
      justify-content: center;
    }

    .gallery {
      max-width: 920px;
      display: grid;
      grid-template-columns: repeat(3, var(--card-w));
      gap: 40px 36px;
      justify-content: center;
    }

    .rail {
      display: grid;
      gap: 26px;
      position: sticky;
      top: 28px;
    }

    .rail-label {
      margin: 0 0 2px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .flashcard {
      width: var(--card-w);
      height: var(--card-h);
      border: 0;
      padding: 0;
      background: transparent;
      perspective: 1000px;
      cursor: pointer;
      text-align: left;
    }

    .flashcard:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 7px;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .flashcard[aria-pressed="true"] .flashcard-inner,
    .flashcard.is-flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--card-shell);
      border-radius: var(--radius-card);
      padding: var(--shell-pad);
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
      overflow: hidden;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    .card-front {
      display: grid;
      grid-template-rows: 1fr var(--footer-h);
    }

    .card-panel {
      position: relative;
      background: var(--card-grad, var(--grad-purple));
      border-radius: var(--radius-panel);
      clip-path: polygon(
        13% 0%,
        100% 0%,
        100% 88%,
        88% 100%,
        0% 100%,
        0% 13%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(145deg, rgba(255,255,255,.14), transparent 34%),
        linear-gradient(315deg, rgba(0,0,0,.08), transparent 46%);
      pointer-events: none;
    }

    .card-label {
      position: absolute;
      top: 12px;
      left: 10px;
      z-index: 2;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      color: var(--ink);
      text-transform: uppercase;
    }

    .card-icon {
      position: relative;
      z-index: 1;
      width: 118px;
      height: 118px;
      color: rgba(255,255,255,.92);
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.16));
      opacity: .95;
    }

    .card-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .card-footer {
      background: var(--card-shell);
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .card-title {
      font-size: 30px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .card-title.long {
      font-size: 23px;
      line-height: .95;
    }

    .back-panel {
      height: 100%;
      padding: 28px 20px;
      border-radius: var(--radius-panel);
      clip-path: polygon(
        13% 0%,
        100% 0%,
        100% 88%,
        88% 100%,
        0% 100%,
        0% 13%
      );
      background: var(--back-grad, linear-gradient(
        135deg,
        #eeeaff 0%,
        #f6f2ff 52%,
        #fbf9ff 100%
      ));
      overflow: hidden;
    }

    .back-label {
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
    }

    .back-title {
      margin: 38px 0 22px;
      font-size: 28px;
      font-weight: 900;
      line-height: .95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .back-title.long {
      font-size: 23px;
    }

    .back-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(11,13,18,.16);
    }

    .back-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .back-section h3 {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .back-section p,
    .back-section code {
      margin: 0;
      font-size: 12px;
      font-weight: 550;
      line-height: 1.35;
    }

    .purple { --card-grad: var(--grad-purple); --back-grad: linear-gradient(135deg, #eeeaff 0%, #f6f2ff 52%, #fbf9ff 100%); }
    .gold { --card-grad: var(--grad-gold); --back-grad: linear-gradient(135deg, #fff2c7 0%, #fff8e2 52%, #fffdf3 100%); }
    .blue { --card-grad: var(--grad-blue); --back-grad: linear-gradient(135deg, #e6f0ff 0%, #f1f7ff 52%, #f8fbff 100%); }
    .cyan { --card-grad: var(--grad-cyan); --back-grad: linear-gradient(135deg, #ddfaff 0%, #effdff 52%, #f8ffff 100%); }
    .lime { --card-grad: var(--grad-lime); --back-grad: linear-gradient(135deg, #f0ffd0 0%, #f8ffe8 52%, #fcfff4 100%); }
    .pink { --card-grad: var(--grad-pink); --back-grad: linear-gradient(135deg, #ffe5ed 0%, #fff2f2 52%, #fffaf6 100%); }
    .violet { --card-grad: var(--grad-violet); --back-grad: linear-gradient(135deg, #f7e5ff 0%, #fcf2ff 52%, #fff9ff 100%); }

    .note {
      width: var(--card-w);
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.35;
    }

    @media (max-width: 1240px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .rail {
        position: static;
        grid-template-columns: repeat(2, var(--card-w));
        justify-content: center;
      }

      .note {
        grid-column: 1 / -1;
        width: calc((var(--card-w) * 2) + 26px);
      }
    }

    @media (max-width: 980px) {
      .gallery {
        grid-template-columns: repeat(2, var(--card-w));
      }
    }

    @media (max-width: 620px) {
      .page {
        padding: 28px 16px 40px;
      }

      .gallery,
      .rail {
        grid-template-columns: 1fr;
      }

      .flashcard {
        margin: 0 auto;
      }

      .note {
        width: var(--card-w);
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute; overflow:hidden">
    <symbol id="icon-file" viewBox="0 0 96 96">
      <path d="M25 15h34l14 15v51H25V15Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
      <path d="M58 16v17h15M37 43h22M37 56h22M37 69h15" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 96 96">
      <path d="M29 43V30c0-11 8-19 19-19s19 8 19 19v13" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <path d="M25 43h46v37H25z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
      <path d="M48 56v10" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-text" viewBox="0 0 96 96">
      <path d="M20 30c0-6 5-11 11-11h34c6 0 11 5 11 11v25c0 6-5 11-11 11H43L27 78V66c-4-1-7-5-7-10V30Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
      <path d="M36 41h26M36 53h18" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>

      <path d="m19 30 29 17 29-17M48 47v35" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>

      <path d="M32 28h42M32 48h42M32 68h42" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <circle cx="20" cy="28" r="4" fill="currentColor"/>
      <circle cx="20" cy="48" r="4" fill="currentColor"/>
      <circle cx="20" cy="68" r="4" fill="currentColor"/>
    </symbol>

      <path d="M35 36c0-8 6-15 15-15 8 0 15 6 15 14 0 7-4 11-10 15-5 3-7 7-7 13" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <path d="M48 77h.1" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <circle cx="48" cy="48" r="36" fill="none" stroke="currentColor" stroke-width="7"/>

    <symbol id="icon-warning" viewBox="0 0 96 96">

      <path d="M23 52 12 41l11-11M73 30l11 11-11 11M39 66l18-51" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 75h52" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>

    <symbol id="icon-anchor" viewBox="0 0 96 96">
      <circle cx="48" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="7"/>

    </symbol>
  </svg>

  <main class="page">
    <header class="masthead">
      <div class="mark" aria-hidden="true">R</div>
      <div>
        <h1>Rust Flashcards</h1>
        <p>Card design mockup from the vocabulary deck.</p>
      </div>
    </header>

    <div class="layout">
      <section class="gallery" aria-label="Rust vocabulary card examples">
        <button class="flashcard purple" type="button" aria-pressed="false" aria-label="Flip let card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-file"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">let</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">let</h2>
                <section class="back-section"><h3>Meaning</h3><p>Creates a new variable.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>Every time you store a value.</p></section>
                <section class="back-section"><h3>Case</h3><p><code>let age = 25;</code></p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard gold" type="button" aria-pressed="false" aria-label="Flip mut card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-lock"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">mut</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">mut</h2>
                <section class="back-section"><h3>Meaning</h3><p>Allows a variable to change after it is set.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>When your program needs to update state.</p></section>
                <section class="back-section"><h3>Case</h3><p>Useful for balances, counters, and account data that changes.</p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard blue" type="button" aria-pressed="false" aria-label="Flip String card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-text"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">String</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">String</h2>
                <section class="back-section"><h3>Meaning</h3><p>Owned, growable text.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>Text you build or change at runtime.</p></section>
                <section class="back-section"><h3>Case</h3><p>Names, labels, and messages your program creates.</p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard cyan" type="button" aria-pressed="false" aria-label="Flip Tuple card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-group"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">Tuple</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">Tuple</h2>
                <section class="back-section"><h3>Meaning</h3><p>A group of mixed-type values with a fixed size.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>When a small set of values belongs together.</p></section>
                <section class="back-section"><h3>Case</h3><p><code>("Alice", 25, true)</code></p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard lime" type="button" aria-pressed="false" aria-label="Flip Struct card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-cube"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">Struct</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">Struct</h2>
                <section class="back-section"><h3>Meaning</h3><p>A custom type that groups named fields together.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>Defining account data, payment plans, subscribers, or records.</p></section>
                <section class="back-section"><h3>Case</h3><p>Use when one thing has several named parts.</p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard violet" type="button" aria-pressed="false" aria-label="Flip Enum card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-list"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">Enum</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">Enum</h2>
                <section class="back-section"><h3>Meaning</h3><p>A type that can be exactly one of several named options.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>Subscription status, payment state, or instruction results.</p></section>
                <section class="back-section"><h3>Case</h3><p>Use for states like Active, Expired, or Paused.</p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard purple" type="button" aria-pressed="false" aria-label="Flip Option card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-question"></use></svg></span></span>
              <span class="card-footer"><span class="card-title long">Option&lt;T&gt;</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title long">Option&lt;T&gt;</h2>
                <section class="back-section"><h3>Meaning</h3><p>Either Some(value) or None.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>Any value that could be absent. It replaces null.</p></section>
                <section class="back-section"><h3>Case</h3><p>Use when a lookup might not find anything.</p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard pink" type="button" aria-pressed="false" aria-label="Flip Result card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-warning"></use></svg></span></span>
              <span class="card-footer"><span class="card-title long">Result&lt;T,E&gt;</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title long">Result&lt;T,E&gt;</h2>
                <section class="back-section"><h3>Meaning</h3><p>Either Ok(value) or Err(error).</p></section>
                <section class="back-section"><h3>When to use it</h3><p>Any operation that can fail.</p></section>
                <section class="back-section"><h3>Case</h3><p>Payments, parsing, validation, and account loading.</p></section>
              </span>
            </span>
          </span>
        </button>

        <button class="flashcard lime" type="button" aria-pressed="false" aria-label="Flip Trait card">
          <span class="flashcard-inner">
            <span class="flashcard-face card-front">
              <span class="card-label">Rust</span>
              <span class="card-panel"><span class="card-icon"><svg><use href="#icon-code"></use></svg></span></span>
              <span class="card-footer"><span class="card-title">Trait</span></span>
            </span>
            <span class="flashcard-face flashcard-back">
              <span class="back-panel">
                <span class="back-label">Rust</span>
                <h2 class="back-title">Trait</h2>
                <section class="back-section"><h3>Meaning</h3><p>Defines shared behavior, similar to an interface.</p></section>
                <section class="back-section"><h3>When to use it</h3><p>When different types need to do the same thing.</p></section>
                <section class="back-section"><h3>Case</h3><p>Printing, comparing, copying, and serializing types.</p></section>
              </span>
            </span>
          </span>
        </button>
      </section>

      <aside class="rail" aria-label="Front and back examples">
        <div>
          <p class="rail-label">Front</p>
          <button class="flashcard blue" type="button" aria-pressed="false" aria-label="Flip Pubkey card">
            <span class="flashcard-inner">
              <span class="flashcard-face card-front">
                <span class="card-label">Rust</span>
                <span class="card-panel"><span class="card-icon"><svg><use href="#icon-key"></use></svg></span></span>
                <span class="card-footer"><span class="card-title">Pubkey</span></span>
              </span>
              <span class="flashcard-face flashcard-back">
                <span class="back-panel">
                  <span class="back-label">Rust</span>
                  <h2 class="back-title">Pubkey</h2>
                  <section class="back-section"><h3>Meaning</h3><p>A 32-byte public key that identifies a wallet or account.</p></section>
                  <section class="back-section"><h3>When to use it</h3><p>Storing addresses in account structs.</p></section>
                  <section class="back-section"><h3>Case</h3><p>Use when the program needs to remember who owns something.</p></section>
                </span>
              </span>
            </span>
          </button>
        </div>

        <div>
          <p class="rail-label">Back</p>
          <button class="flashcard gold is-flipped" type="button" aria-pressed="true" aria-label="Flip Anchor card">
            <span class="flashcard-inner">
              <span class="flashcard-face card-front">
                <span class="card-label">Rust</span>
                <span class="card-panel"><span class="card-icon"><svg><use href="#icon-anchor"></use></svg></span></span>
                <span class="card-footer"><span class="card-title">Anchor</span></span>
              </span>
              <span class="flashcard-face flashcard-back">
                <span class="back-panel">
                  <span class="back-label">Rust</span>
                  <h2 class="back-title">Anchor</h2>
                  <section class="back-section"><h3>Meaning</h3><p>A framework for writing Solana programs that handles boilerplate and security checks.</p></section>
                  <section class="back-section"><h3>When to use it</h3><p>Every Anchor program you write.</p></section>
                  <section class="back-section"><h3>Case</h3><p>Use it to build practical on-chain apps without writing every low-level check by hand.</p></section>
                </span>
              </span>
            </span>
          </button>
        </div>

        <p class="note">Click a card to flip it. This version uses the corrected structure: only the clipped panel receives color, and the footer remains white.</p>
      </aside>
    </div>
  </main>

  <script>
    document.querySelectorAll(".flashcard").forEach((card) => {
      card.addEventListener("click", () => {
        const pressed = card.getAttribute("aria-pressed") === "true";
        card.setAttribute("aria-pressed", String(!pressed));
        card.classList.toggle("is-flipped", !pressed);
      });
    });
  </script>
</body>
</html>
